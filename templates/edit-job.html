{% extends 'base.html' %}{% load static %}{% block head %}<title>
  JobPortal - Edit Job</title
><link rel="stylesheet" href="{% static 'css/edit-job.css' %}" />{% endblock
%}{% block content %}
<section id="edit-job" class="form-page">
  <div id="edit-job-box" class="form-shell">
    <div class="form-header">
      <span class="eyebrow">Manage opportunity</span>
      <h1>Edit job</h1>
      <p>Update the details of your published position.</p>
    </div>
    <form method="edit">
      {% csrf_token %}
      <div class="input-box">
        <label for="title">Job Title</label
        ><input type="text" name="title" id="title" value="{{ job.title }}" />
      </div>
      <div class="input-box">
        <label for="company">Company</label
        ><input
          type="text"
          name="company"
          id="company"
          value="{{ job.company }}"
        />
      </div>
      <div class="input-box">
        <label for="location">Location</label
        ><input
          type="text"
          name="location"
          id="location"
          value="{{ job.location }}"
        />
      </div>
      <div class="input-box">
        <label for="job_type">Job Type</label
        ><select name="job_type" id="job_type">
          {% for job_type in job_types %}
          <option value="{{ job_type.id }}">{{ job_type.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="input-box">
        <label for="category">Category</label
        ><select name="category" id="category">
          {% for category in categories %}
          <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="input-box">
        <label for="apply-type">Application Method</label
        ><select name="apply_type" id="apply-type">
          <option value="resume">Resume</option>
          <option value="link">External Link</option>
        </select>
      </div>
      <div class="input-box">
        <label for="description">Description</label
        ><textarea name="description" id="description">
{{ job.description }}</textarea
        >
      </div>
      <div class="input-box" id="apply-link-box">
        <label for="apply-link">Application Link</label
        ><input type="url" name="apply_link" id="apply-link" />
      </div>
      <div class="form-action">
        <button type="submit" class="edit-job-btn">
          Save Changes <i class="fa-solid fa-check"></i>
        </button>
      </div>
    </form>
  </div>
</section>
<script src="{% static 'js/post-job.js' %}"></script>
{% endblock %}
