{% extends 'base.html' %} {% load static %} {% block content %}
<title>JobPortal - Home</title>
<link rel="stylesheet" href="{% static 'css/post-job.css' %}" />
<script src="{% static 'js/post-job.js' %}"></script>

<div id="post-job">
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}

    <div id="post-job-box">
        <h2>Post Job</h2>
        <form method="post">
            {% csrf_token %}
            <div class="input-box">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" required>
            </div>
            <div class="input-box">
                <label for="description">Description</label>
                <textarea name="description" id="description" required></textarea>
            </div>
            <div class="input-box">
                <label for="location">Location</label>
                <input type="text" name="location" id="location" required>
            </div>
            <div class="input-box">
                <label for="company">Company</label>
                <input type="text" name="company" id="company" required>
            </div>
            
            <div class="input-box">
                <label for="job_type">Job Type</label>
                <select name="job_type" id="job_type" required>
                    {% for job_type in job_types %}
                    <option value="{{ job_type.id }}">{{ job_type.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="input-box">
                <label for="category">Category</label>
                <select name="category" id="category" required>
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="input-box">
                <label for="apply-type">Apply Type</label>
                <select name="apply_type" id="apply-type" required>
                    <option value="resume">Resume</option>
                    <option value="link">Link</option>
                </select>
            </div>
            <div class="input-box" id="apply-link-box" required>
                <label for="apply-link">Apply Link</label>
                <input type="url" name="apply_link" id="apply-link" required>
            </div>
            <button type="submit" class="post-job-btn">Post Job</button>
        </form>
    </div>
</div>

{% endblock %}
